  <!-- JSON-LD Structured Data: WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Tennis Elbow Hub",
    "alternateName": "TE4 Hub",
    "url": "https://tenniselbowhub.live",
    "description": "The community hub for Tennis Elbow 4 players. Live scores, match analysis, online tours, and video guides.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://tenniselbowhub.live/live?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- JSON-LD Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tennis Elbow Hub",
    "url": "https://tenniselbowhub.live",
    "logo": "https://tenniselbowhub.live/logo_fav.svg",
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "contact@tenniselbowhub.live",
      "contactType": "customer support",
      "url": "https://discord.com/invite/PY7hZXZcF6"
    },
    "sameAs": [
      "https://discord.com/invite/PY7hZXZcF6"
    ]
  }
  </script>

  <!-- JSON-LD Structured Data: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How does the Live Scores feature work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Tennis Elbow Hub connects to the Tennis Elbow 4 server list and fetches match data in real time. When players create online matches, they appear on our scoreboard with live score updates, player ELO ratings, surface information, and match duration. The data refreshes every few seconds via WebSocket, so you always see the latest state."
        }
      },
      {
        "@type": "Question",
        "name": "How do I upload a match log for analysis?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "After playing online matches in Tennis Elbow 4, the game generates HTML match log files. Go to the Match Log Analysis tab, click the upload area, and select your match log file. The system will parse it and display detailed statistics including radar charts, win rates, and performance metrics for each match."
        }
      },
      {
        "@type": "Question",
        "name": "What are the XKT and WTSL tours?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "XKT and WTSL are community-organized competitive tours for Tennis Elbow 4 online players. They feature scheduled tournaments, seasonal rankings, and structured competition. Visit the Online Tours tab to learn more about each tour's rules, schedules, and how to join."
        }
      },
      {
        "@type": "Question",
        "name": "Is Tennis Elbow Hub free to use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes! Tennis Elbow Hub is completely free. All features — live scores, match analysis, tour information, and guides — are available to everyone. If you enjoy the site, you can support its development through the Ko-fi donation button."
        }
      },
      {
        "@type": "Question",
        "name": "Does Tennis Elbow Hub store my data?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Accounts are optional. Live scores, match analysis and guides work without one. You only need an account for community features such as uploading outfits and managing a profile, and signing up stores your display name and email address. Uploaded match logs are read by our server to produce your statistics and are not saved to our database. We use Google Analytics for anonymous usage statistics and Google AdSense for advertising."
        }
      }
    ]
  }
  </script>

  <title>Tennis Elbow Hub</title>
</head>

<body>

  <div id="app"></div>
